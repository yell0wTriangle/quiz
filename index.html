<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>IT Questions Quiz</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">Q</span>
          <div><p class="eyebrow">ITQUES</p><h1>Practice quiz</h1></div>
        </div>
        <div class="header-actions">
          <span id="progressText" class="progress-text" aria-live="polite"></span>
          <button id="openFiltersButton" class="button button-secondary" type="button" aria-haspopup="dialog">Filters</button>
          <button id="themeToggle" class="button button-secondary theme-toggle" type="button" aria-pressed="false">🌙 Dark</button>
          <button id="resetButton" class="button button-secondary" type="button">Start fresh</button>
        </div>
      </header>

      <dialog id="filterDialog" class="filter-dialog" aria-labelledby="topicHeading">
        <div class="filter-dialog-header">
          <div><p class="eyebrow">Personalize</p><h2>Quiz filters</h2></div>
          <button id="closeFiltersButton" class="button button-secondary" type="button">Done</button>
        </div>
        <section class="filter-panel" aria-labelledby="topicHeading">
        <div class="filter-title">
          <div>
            <p class="eyebrow">Question source</p>
            <h2>Choose a section</h2>
          </div>
          <label class="source-select-label" for="sourceSelect">Section
            <select id="sourceSelect" class="source-select">
              <option value="pdf_new">PDF questions</option>
              <option value="book_new">Book questions</option>
            </select>
          </label>
        </div>
        <div class="filter-title">
          <div>
            <p class="eyebrow">Topics</p>
            <h2 id="topicHeading">Choose what to practice</h2>
          </div>
          <div class="filter-actions">
            <button id="selectAllButton" class="text-button" type="button">Select all</button>
            <button id="clearTopicsButton" class="text-button" type="button">Clear</button>
          </div>
        </div>
        <div id="topicFilters" class="topic-filters"></div>
        <p id="filterHint" class="filter-hint"></p>
        </section>
      </dialog>

      <div class="quiz-layout">
        <aside class="question-grid-panel" aria-labelledby="questionGridHeading">
          <h2 id="questionGridHeading">Questions</h2>
          <div id="questionGrid" class="question-grid"></div>
          <div class="question-grid-legend"><span><i class="grid-dot unanswered"></i>Unattempted</span><span><i class="grid-dot correct"></i>Correct</span><span><i class="grid-dot wrong"></i>Wrong</span></div>
        </aside>
        <section class="question-card" aria-live="polite">
          <div class="question-meta">
            <button id="questionNumber" class="pill question-number-button" type="button" aria-haspopup="dialog" aria-controls="questionGridDialog"></button>
            <span id="questionTopic" class="topic-name"></span>
          </div>
          <div class="question-prompt"><h2 id="questionText"></h2></div>
          <div id="options" class="options" role="radiogroup" aria-label="Answer options"></div>
          <p id="answerFeedback" class="answer-feedback" aria-live="polite"></p>
          <div class="navigation-actions">
            <button id="previousButton" class="button button-secondary" type="button">Previous</button>
            <button id="nextButton" class="button button-primary" type="button">Next question</button>
          </div>
        </section>
      </div>
    </main>
    <dialog id="questionGridDialog" class="question-grid-dialog" aria-labelledby="mobileQuestionGridHeading">
      <div class="question-grid-dialog-header"><h2 id="mobileQuestionGridHeading">Choose a question</h2><button id="closeQuestionGridButton" class="button button-secondary" type="button">Done</button></div>
      <div id="mobileQuestionGrid" class="question-grid"></div>
      <div class="question-grid-legend"><span><i class="grid-dot unanswered"></i>Unattempted</span><span><i class="grid-dot correct"></i>Correct</span><span><i class="grid-dot wrong"></i>Wrong</span></div>
    </dialog>
    <dialog id="resetDialog" class="reset-dialog">
      <h2>Start a new quiz?</h2>
      <p>This clears your saved answers and creates a newly shuffled quiz.</p>
      <div class="dialog-actions">
        <button id="cancelResetButton" class="button button-secondary" type="button">Cancel</button>
        <button id="confirmResetButton" class="button button-danger" type="button">Start fresh</button>
      </div>
    </dialog>
    <script src="questions.js"></script>
    <script src="app.js"></script>
  </body>
</html>
